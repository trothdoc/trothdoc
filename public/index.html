<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TrothDoc — Version control for documents</title>
  <meta name="description"
        content="Track every version. Review every change. Keep the complete history.">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    main {
      max-width: 760px;
      padding: 40px;
    }
    h1 {
      font-size: 64px;
      margin: 0;
      letter-spacing: -3px;
    }
    h2 {
      font-size: 32px;
      font-weight: 500;
      margin: 24px 0 12px;
    }
    p {
      color: #aaa;
      font-size: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>TrothDoc</h1>

    <h2>Version control for documents.</h2>

    <p>
      Track every version. Review every change.
      Keep the complete history.
    </p>
  </main>
</body>
</html>
